openapi: 3.0.3
info:
  title: JWT Auth Backend API
  version: 1.0.0
  description: |
    OpenAPI definition generated from the Spring Boot controller and security
    configuration in the JWT-auth-backend repository under example/example.

    Notes based on the current implementation:
    - Base controller path is /cloudVendor
    - /cloudVendor/registerUser and /cloudVendor/loginUser are public
    - All other /cloudVendor endpoints require authentication
    - Login currently returns a raw JWT token string
    - Vendor create/update/delete endpoints currently return plain text messages
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Vendor
    description: Cloud vendor CRUD operations
  - name: Authentication
    description: User registration and login operations
  - name: Security
    description: Security and CSRF-related endpoints

paths:
  /cloudVendor/vendors:
    get:
      tags:
        - Vendor
      summary: List all vendors
      operationId: getAllVendorDetails
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Vendor list returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CloudVendorModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /cloudVendor/vendors/{vendorId}:
    get:
      tags:
        - Vendor
      summary: Get vendor by ID
      operationId: getVendorDetails
      security:
        - bearerAuth: []
      parameters:
        - name: vendorId
          in: path
          required: true
          description: Vendor identifier
          schema:
            type: string
      responses:
        '200':
          description: Vendor details returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudVendorModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Vendor not found

  /cloudVendor/addVendorDetails:
    post:
      tags:
        - Vendor
      summary: Create vendor details
      operationId: insertVendorDetails
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudVendorModel'
      responses:
        '200':
          description: Plain text success or failure message
          content:
            text/plain:
              schema:
                type: string
                example: V001 Cloud Vendor details created successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /cloudVendor/updateVendorDetails:
    put:
      tags:
        - Vendor
      summary: Update vendor details
      operationId: putVendorDetails
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudVendorModel'
      responses:
        '200':
          description: Plain text success or failure message
          content:
            text/plain:
              schema:
                type: string
                example: V001 Cloud Vendor details updated successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /cloudVendor/deleteVendorDetails/{vendorId}:
    delete:
      tags:
        - Vendor
      summary: Delete vendor details by ID
      operationId: deleteVendorDetails
      security:
        - bearerAuth: []
      parameters:
        - name: vendorId
          in: path
          required: true
          description: Vendor identifier
          schema:
            type: string
      responses:
        '200':
          description: Plain text success or failure message
          content:
            text/plain:
              schema:
                type: string
                example: V001 Cloud Vendor details deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /cloudVendor/getCsrfToken:
    get:
      tags:
        - Security
      summary: Get CSRF token details
      operationId: getCsrfToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: CSRF token object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /cloudVendor/registerUser:
    post:
      tags:
        - Authentication
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '200':
          description: Registered user entity returned by the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMaster'
        '400':
          description: Invalid registration request

  /cloudVendor/loginUser:
    post:
      tags:
        - Authentication
      summary: Authenticate a user and return a JWT token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: JWT token returned as plain text
          content:
            text/plain:
              schema:
                type: string
                example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1c2VyMSJ9.signature
        '401':
          description: Invalid user details

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Authentication required or token invalid
      content:
        text/plain:
          schema:
            type: string
            example: Unauthorized

  schemas:
    CloudVendorModel:
      type: object
      required:
        - vendorId
        - vendorName
        - vendorAddress
        - phoneNumber
      properties:
        vendorId:
          type: string
          example: V001
        vendorName:
          type: string
          example: Vendor One
        vendorAddress:
          type: string
          example: Vijayawada
        phoneNumber:
          type: string
          example: '9701525211'

    UserMaster:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        userName:
          type: string
          example: krishna
        emailId:
          type: string
          format: email
          example: krishna@example.com
        password:
          type: string
          description: |
            Present in the current entity model. In practice, clients should send
            plain text during registration/login, while persisted values are hashed.
          example: password123

    UserRegistrationRequest:
      type: object
      required:
        - userName
        - emailId
        - password
      properties:
        userName:
          type: string
          example: krishna
        emailId:
          type: string
          format: email
          example: krishna@example.com
        password:
          type: string
          format: password
          example: password123

    UserLoginRequest:
      type: object
      required:
        - userName
        - password
      properties:
        userName:
          type: string
          example: krishna
        password:
          type: string
          format: password
          example: password123

    CsrfTokenResponse:
      type: object
      properties:
        token:
          type: string
          example: 62f4d7f1-2e8d-4ad2-b1a8-token
        parameterName:
          type: string
          example: _csrf
        headerName:
          type: string
          example: X-CSRF-TOKEN